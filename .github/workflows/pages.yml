name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure A4 required pages exist
        run: |
          if [ ! -f source/index/index.md ]; then
            npx hexo new page index
          fi
          if [ ! -f source/list/index.md ]; then
            npx hexo new page list
          fi

      - name: Build
        run: |
          npx hexo generate
          ls -la public
          if [ -f public/index.html ]; then
            wc -c public/index.html
          fi

      - name: Verify generated homepage
        run: |
          ls -la public || true
          if [ -f public/index.html ]; then
            wc -c public/index.html
          else
            echo "public/index.html is missing"
          fi
          test -s public/index.html

      - name: Deploy to gh-pages branch
        run: |
          git fetch origin gh-pages
          git worktree add gh-pages-deploy origin/gh-pages
          rsync -a --delete public/ gh-pages-deploy/
          cd gh-pages-deploy
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes to commit"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages

