name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: |
          npx hexo generate
          ls -la public
          if [ -f public/index.html ]; then
            wc -c public/index.html
          fi

      - name: Verify generated homepage
        run: |
          ls -la public || true
          if [ -f public/index.html ]; then
            wc -c public/index.html
          else
            echo "public/index.html is missing"
          fi
          test -s public/index.html

      - name: Deploy to gh-pages branch
        run: |
          git fetch origin gh-pages
          git worktree add -B gh-pages gh-pages-deploy origin/gh-pages
          rsync -a --delete public/ gh-pages-deploy/
          touch gh-pages-deploy/.nojekyll
          git -C gh-pages-deploy add -A
          if git -C gh-pages-deploy diff --cached --quiet; then
            echo "No deployment changes to commit"
            exit 0
          fi
          git -C gh-pages-deploy config user.name github-actions[bot]
          git -C gh-pages-deploy config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C gh-pages-deploy commit -m "deploy: ${GITHUB_SHA}"
          git -C gh-pages-deploy push origin gh-pages

